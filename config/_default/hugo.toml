# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://www.caiada.edu.kg/"
defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = false
# disableLanguages = ["en"] #to allow translation work requiring shipping to production

# 多語言配置
[languages]
  [languages.zh-tw]
    weight = 1
    locale = "zh-tw"
    label = "繁體中文"
  [languages.zh-cn]
    weight = 2
    locale = "zh-cn"
    label = "简体中文"
  [languages.en]
    weight = 3
    locale = "en"
    label = "English"
  [languages.vi]
    weight = 4
    locale = "vi"
    label = "Tiếng Việt"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 30
hasCJKLanguage = true

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-PEDMYR1V0K"

[pagination]
  pagerSize = 102

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'always'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
