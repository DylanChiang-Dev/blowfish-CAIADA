<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f78c8" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#1f78c8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1f78c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d5ab54" stop-opacity="0.22"/>
      <stop offset="58%" stop-color="#d5ab54" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d5ab54" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f78c8" stop-opacity="0.08"/>
      <stop offset="48%" stop-color="#1687b8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#b88b2e" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="copy-wash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7fbff" stop-opacity="0.86"/>
      <stop offset="45%" stop-color="#f7fbff" stop-opacity="0.68"/>
      <stop offset="82%" stop-color="#f7fbff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f7fbff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <style>
      .drift-a { animation: driftA 26s linear infinite; }
      .drift-b { animation: driftB 34s linear infinite; }
      .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: center; }
      .pulse:nth-of-type(2n) { animation-delay: -1.4s; }
      .pulse:nth-of-type(3n) { animation-delay: -2.8s; }
      .dash { stroke-dasharray: 9 24; animation: dash 16s linear infinite; }
      @keyframes driftA {
        from { transform: translate3d(-90px, 34px, 0); }
        to { transform: translate3d(90px, -34px, 0); }
      }
      @keyframes driftB {
        from { transform: translate3d(80px, -42px, 0); }
        to { transform: translate3d(-80px, 42px, 0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: .34; transform: scale(.86); }
        50% { opacity: .76; transform: scale(1.14); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -330; }
      }
      @media (prefers-reduced-motion: reduce) {
        .drift-a, .drift-b, .pulse, .dash { animation: none; }
      }
      @media (max-width: 767px) {
        .drift-a, .drift-b, .pulse, .dash { animation: none; }
        .soft-shape { filter: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7fbff"/>
  <rect width="1600" height="900" fill="#eaf4fb" opacity="0.72"/>
  <circle class="soft-shape" cx="1320" cy="160" r="520" fill="#1f78c8" opacity="0.12" filter="url(#soft)"/>
  <circle class="soft-shape" cx="1180" cy="780" r="420" fill="#2ab8dc" opacity="0.09" filter="url(#soft)"/>
  <circle class="soft-shape" cx="190" cy="760" r="360" fill="#d5ab54" opacity="0.08" filter="url(#soft)"/>

  <g class="drift-a" fill="none" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round">
    <path class="dash" d="M-80 760 C 220 620, 390 800, 650 650 S 1040 380, 1680 520"/>
    <path class="dash" d="M-120 570 C 250 470, 520 520, 760 410 S 1180 160, 1720 260" opacity="0.68"/>
    <path class="dash" d="M120 910 C 410 690, 600 730, 840 570 S 1120 460, 1640 650" opacity="0.72"/>
  </g>

  <g class="drift-b" fill="none" stroke="#1687b8" stroke-width="1.4" stroke-linecap="round" opacity="0.22">
    <path d="M760 110 L920 230 L1110 170 L1300 330 L1500 250"/>
    <path d="M650 720 L850 620 L1030 700 L1210 540 L1470 610"/>
    <path d="M430 250 L610 330 L780 290 L960 420 L1190 390"/>
    <path d="M260 700 L480 590 L640 660 L820 520"/>
  </g>

  <g opacity="0.6">
    <g class="pulse"><circle cx="920" cy="230" r="34" fill="url(#glow-blue)"/><circle cx="920" cy="230" r="5" fill="#1f78c8"/></g>
    <g class="pulse"><circle cx="1110" cy="170" r="28" fill="url(#glow-gold)"/><circle cx="1110" cy="170" r="4" fill="#b88b2e"/></g>
    <g class="pulse"><circle cx="1300" cy="330" r="38" fill="url(#glow-blue)"/><circle cx="1300" cy="330" r="6" fill="#1f78c8"/></g>
    <g class="pulse"><circle cx="850" cy="620" r="31" fill="url(#glow-blue)"/><circle cx="850" cy="620" r="5" fill="#1f78c8"/></g>
    <g class="pulse"><circle cx="1030" cy="700" r="30" fill="url(#glow-gold)"/><circle cx="1030" cy="700" r="5" fill="#b88b2e"/></g>
    <g class="pulse"><circle cx="1210" cy="540" r="40" fill="url(#glow-blue)"/><circle cx="1210" cy="540" r="6" fill="#1f78c8"/></g>
    <g class="pulse"><circle cx="610" cy="330" r="24" fill="url(#glow-blue)"/><circle cx="610" cy="330" r="4" fill="#1f78c8"/></g>
  </g>

  <g opacity="0.16" stroke="#2b4963" stroke-width="1">
    <path d="M0 695 H1600"/>
    <path d="M0 730 H1600"/>
    <path d="M0 765 H1600"/>
    <path d="M0 800 H1600"/>
  </g>
  <rect width="1600" height="900" fill="url(#copy-wash)"/>
  <rect width="1600" height="900" fill="none" stroke="#1f78c8" stroke-opacity="0.08" stroke-width="2"/>
</svg>
